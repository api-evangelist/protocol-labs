aid: protocol-labs
name: Protocol Labs
description: >-
  Protocol Labs is an open-source research and development company founded in 2014 by Juan Benet,
  best known for creating foundational decentralized web protocols including IPFS (the InterPlanetary
  File System), Filecoin (a decentralized storage network), libp2p (a modular peer-to-peer networking
  stack), and IPLD (a data model for content-addressed systems). Since its founding it has grown into
  an innovation network connecting more than 750 startups, funds, accelerators, foundations, and
  open-source projects working across web3, AI, robotics, cryptography, and neurotechnology. Protocol
  Labs itself (protocol.ai) is a research and venture organization rather than a commercial API
  provider — it publishes no first-party REST API; its developer surfaces (IPFS HTTP APIs, Filecoin
  JSON-RPC, libp2p) live in their own separate open-source projects and GitHub organizations.
